version = 1

# Files without an SPDX header take the licence below; files with a header keep theirs.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Iain Chesworth Labs contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Bundled typefaces. Their licence texts are in the same directories and in the generated notices.
[[annotations]]
path = ["assets/fonts/Archivo-*.ttf"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The Archivo Project Authors (https://github.com/Omnibus-Type/Archivo)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/Andika-*.ttf", "docs/design/toybox/fonts/Andika-*.ttf", "docs/design/toybox/fonts/Andika-OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2004-2025 SIL Global (https://www.sil.org/)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/IBMPlexMono-*.ttf"]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["docs/design/toybox/fonts/pixelify-sans-*.woff2", "docs/design/toybox/fonts/LICENSE-pixelify-sans.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2021 The Pixelify Sans Project Authors (https://github.com/eifetx/Pixelify-Sans)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["docs/design/toybox/fonts/silkscreen-*.woff2", "docs/design/toybox/fonts/LICENSE-silkscreen.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2001 The Silkscreen Project Authors (https://github.com/googlefonts/silkscreen)"
SPDX-License-Identifier = "OFL-1.1"

# The English word list is ENABLE, kept byte for byte as fetched (data/README.md).
[[annotations]]
path = ["data/dictionaries/en.txt"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "LicenseRef-ENABLE-Public-Domain"

# The Tracy port is the vcpkg port with local patches.
[[annotations]]
path = ["cmake/vcpkg-ports/tracy/**"]
precedence = "override"
SPDX-FileCopyrightText = "Microsoft Corporation and vcpkg contributors"
SPDX-License-Identifier = "MIT"

# A verbatim copy of a licence text.
[[annotations]]
path = ["notices/licences/LGPL-3.0.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc."
SPDX-License-Identifier = "LGPL-3.0-only"
